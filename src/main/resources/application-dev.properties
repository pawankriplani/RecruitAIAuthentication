##############################################
# Server Configuration
##############################################
server.port=${PORT:1998}

##############################################
# Database Configuration - PostgreSQL
##############################################
spring.datasource.url=jdbc:postgresql://35.244.60.117:5432/mydb?sslmode=disable&sslfactory=org.postgresql.ssl.NonValidatingFactory&preferQueryMode=simple
spring.datasource.username=postgres
spring.datasource.password=Mydb1298@
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP Connection Pool ---
spring.datasource.hikari.pool-name=RecruitAIAuthenticationHikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.allow-pool-suspension=false
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.validation-timeout=5000

##############################################
# JPA & Hibernate Configuration
##############################################
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none  
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false

# Hibernate Performance Optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

##############################################
# Security Configuration
##############################################
spring.security.user.name=sa
spring.security.user.password=

##############################################
# JWT Configuration
##############################################
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=3600
jwt.refresh-expiration=86400

##############################################
# Logging Configuration
##############################################
logging.file.name=logs/application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

##############################################
# Google Cloud Configuration
##############################################
spring.cloud.gcp.pubsub.enabled=false
spring.cloud.gcp.core.enabled=false

##############################################
# Actuator Configuration
##############################################
management.endpoints.web.exposure.include=*
management.endpoint.shutdown.enabled=true

