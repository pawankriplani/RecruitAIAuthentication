openapi: 3.0.0
info:
  title: Authentication API
  version: 1.0.0
  description: API for user authentication, registration, and manager approval

servers:
  - url: http://localhost:8080

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          description: Successful registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/auth/login:
    post:
      summary: User login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/auth/refresh:
    post:
      summary: Refresh authentication token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/auth/update-account-status:
    post:
      summary: Update account status
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockAccountRequest'
      responses:
        '200':
          description: Account status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/users/pending-approvals:
    get:
      summary: Get pending user approvals
      tags:
        - User Management
      responses:
        '200':
          description: List of pending approvals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/users/{userId}/reject:
    put:
      summary: Reject a manager account
      tags:
        - User Management
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Manager account rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/users/{userId}/approve:
    put:
      summary: Approve a manager account
      tags:
        - User Management
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Manager account approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/managers:
    get:
      summary: Get all managers with stats
      tags:
        - Manager
      responses:
        '200':
          description: Managers statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerStatsDTO'

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RegistrationRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string

    UnlockAccountRequest:
      type: object
      required:
        - email
        - status
      properties:
        email:
          type: string
          format: email
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LOCKED]

    RejectRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string

    ManagerStatsDTO:
      type: object
      properties:
        totalManagers:
          type: integer
        activeManagers:
          type: integer
        inactiveManagers:
          type: integer
        pendingApprovals:
          type: integer
